<!DOCTYPE html>
<html>
<head>
  <title>导出图标</title>
  <style>
    body { font-family: system-ui; padding: 40px; background: #1a1a1a; color: white; }
    .icons { display: flex; gap: 40px; margin: 40px 0; }
    .icon-item { text-align: center; }
    .icon-item canvas {
      border: 1px solid #4a4a4a;
      border-radius: 12px;
      /* 棋盘底：图标四角是透明的，用格子底才能看出真实边界。 */
      background-color: #ffffff;
      background-image:
        linear-gradient(45deg, #ececec 25%, transparent 25%),
        linear-gradient(-45deg, #ececec 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ececec 75%),
        linear-gradient(-45deg, transparent 75%, #ececec 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    }
    .icon-item p { margin: 10px 0 30px; color: #888; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #f1f3f4; color: #111; border: none; border-radius: 8px; }
    button:hover { background: #ffffff; }
  </style>
</head>
<body>
  <h1>MarkPad 图标导出</h1>
  <p>当前图标：温白底 + 2×2 卡片网格（左上实心）。右键点击图片 → 另存为 PNG。</p>

  <div class="icons">
    <div class="icon-item">
      <canvas id="icon16" width="16" height="16"></canvas>
      <p>16×16</p>
    </div>
    <div class="icon-item">
      <canvas id="icon32" width="32" height="32"></canvas>
      <p>32×32</p>
    </div>
    <div class="icon-item">
      <canvas id="icon48" width="48" height="48"></canvas>
      <p>48×48</p>
    </div>
    <div class="icon-item">
      <canvas id="icon128" width="128" height="128"></canvas>
      <p>128×128</p>
    </div>
  </div>

  <button id="download-icons" disabled>下载所有图标</button>
  <script src="export.js"></script>
</body>
</html>
