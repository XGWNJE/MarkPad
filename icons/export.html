<!DOCTYPE html>
<html>
<head>
  <title>导出图标</title>
  <style>
    body { font-family: system-ui; padding: 40px; background: #1a1a1a; color: white; }
    .icons { display: flex; gap: 40px; margin: 40px 0; }
    .icon-item { text-align: center; }
    .icon-item canvas {
      border: 1px solid #4a4a4a;
      border-radius: 12px;
      /* 棋盘底：图标四角是透明的，用格子底才能看出真实边界。 */
      background-color: #ffffff;
      background-image:
        linear-gradient(45deg, #ececec 25%, transparent 25%),
        linear-gradient(-45deg, #ececec 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ececec 75%),
        linear-gradient(-45deg, transparent 75%, #ececec 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    }
    .icon-item p { margin: 10px 0 30px; color: #888; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #f1f3f4; color: #111; border: none; border-radius: 8px; }
    button:hover { background: #ffffff; }
  </style>
</head>
<body>
  <h1>MarkPad 图标导出</h1>
  <p>当前图标：温白底 + 2×2 卡片网格（左上实心）。右键点击图片 → 另存为 PNG。</p>

  <div class="icons">
    <div class="icon-item">
      <canvas id="icon16" width="16" height="16"></canvas>
      <p>16×16</p>
    </div>
    <div class="icon-item">
      <canvas id="icon48" width="48" height="48"></canvas>
      <p>48×48</p>
    </div>
    <div class="icon-item">
      <canvas id="icon128" width="128" height="128"></canvas>
      <p>128×128</p>
    </div>
  </div>

  <button onclick="downloadAll()">下载所有图标</button>

  <script>
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
      <rect width="128" height="128" rx="30" fill="#FAFAF7"/>
      <rect x="1" y="1" width="126" height="126" rx="29" fill="none" stroke="#E7E5DC" stroke-width="2"/>
      <rect x="29" y="29" width="30" height="30" rx="9" fill="#111111"/>
      <rect x="69" y="29" width="30" height="30" rx="9" fill="#C6C3B7"/>
      <rect x="29" y="69" width="30" height="30" rx="9" fill="#C6C3B7"/>
      <rect x="69" y="69" width="30" height="30" rx="9" fill="#C6C3B7"/>
    </svg>`;

    function drawIcon(size) {
      const canvas = document.getElementById('icon' + size);
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, size, size);
      img.src = 'data:image/svg+xml;base64,' + btoa(svg);
    }

    ['icon16', 'icon48', 'icon128'].forEach(id => {
      const size = parseInt(id.replace('icon', ''));
      drawIcon(size);
    });

    function downloadAll() {
      [16, 48, 128].forEach(size => {
        const canvas = document.getElementById('icon' + size);
        const link = document.createElement('a');
        link.download = 'icon' + size + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
