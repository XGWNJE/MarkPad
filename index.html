<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MarkPad</title>
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="icons/tab-icon.svg"
    />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/icon48.png" />
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="app" class="page-enter-pending">
      <header class="toolbar visible" id="toolbar">
        <div class="toolbar-row">
          <nav id="breadcrumb" class="breadcrumb" aria-label="文件夹路径"></nav>
          <div class="toolbar-section toolbar-utility-actions">
            <button
              id="new-trigger"
              type="button"
              class="toolbar-btn toolbar-icon-btn"
              aria-label="新建"
              aria-haspopup="menu"
              aria-expanded="false"
              title="新建"
            >
              <span data-icon="plus"></span>
            </button>
            <button
              id="organize-trigger"
              type="button"
              class="toolbar-btn toolbar-icon-btn"
              aria-label="整理书签"
              title="整理书签"
            >
              <span data-icon="square-check"></span>
            </button>
            <button
              id="more-trigger"
              type="button"
              class="toolbar-btn toolbar-icon-btn"
              aria-label="更多"
              aria-haspopup="menu"
              aria-expanded="false"
              title="更多"
            >
              <span data-icon="ellipsis"></span>
            </button>
          </div>
        </div>
        <div id="selection-bar" class="selection-bar" hidden>
          <span id="selection-count">已选 0 项</span>
          <div class="selection-actions">
            <button
              id="action-rename"
              type="button"
              class="toolbar-btn toolbar-icon-btn"
              aria-label="重命名"
              title="重命名"
            >
              <span data-icon="pencil"></span>
            </button>
            <button
              id="action-move"
              type="button"
              class="toolbar-btn toolbar-icon-btn"
              aria-label="移动或排序"
              title="移动或排序"
            >
              <span data-icon="folder-input"></span>
            </button>
            <button
              id="action-icon"
              type="button"
              class="toolbar-btn toolbar-icon-btn"
              aria-label="图标"
              title="图标"
            >
              <span data-icon="image"></span>
            </button>
            <button
              id="action-delete"
              type="button"
              class="toolbar-btn toolbar-icon-btn danger"
              aria-label="删除"
              title="删除"
            >
              <span data-icon="trash"></span>
            </button>
            <button
              id="action-more"
              type="button"
              class="toolbar-btn toolbar-icon-btn"
              aria-label="更多整理操作"
              aria-haspopup="menu"
              aria-expanded="false"
              title="更多整理操作"
            >
              <span data-icon="ellipsis"></span>
            </button>
          </div>
          <button id="organize-done" type="button" class="text-button">
            完成
          </button>
        </div>
      </header>
      <main class="content">
        <div class="grid-scroll" id="grid-scroll">
          <div class="grid-scroll-inner">
            <div
              class="bookmark-grid"
              id="bookmark-grid"
              aria-label="书签"
            ></div>
          </div>
        </div>
      </main>
      <aside id="drag-move-panel" class="drag-move-panel" aria-label="移动书签">
        <div class="drag-panel-header">
          <span class="drag-panel-symbol" data-icon="folder-input"></span>
          <span>移动到</span>
        </div>
        <div id="drag-folder-tree" class="drag-folder-tree"></div>
      </aside>
      <aside
        id="drag-delete-zone"
        class="drag-delete-zone"
        aria-label="删除投放区"
      >
        <div class="drag-delete-content">
          <span class="drag-delete-icon" data-icon="trash"></span>
          <div class="drag-delete-copy">
            <span class="drag-delete-title">删除</span>
            <span class="drag-delete-label">松手后确认</span>
          </div>
        </div>
      </aside>
      <div
        id="menu-panel"
        class="dialog hidden"
        inert
        aria-hidden="true"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
      >
        <div class="dialog-overlay"></div>
        <div class="dialog-content menu-panel-content-shell">
          <div class="dialog-header">
            <h3 id="settings-title">设置</h3>
            <button
              class="dialog-close"
              type="button"
              id="settings-close"
              aria-label="关闭设置"
            >
              <span data-icon="x"></span>
            </button>
          </div>
          <div
            class="menu-tabs"
            id="settings-tabs"
            role="tablist"
            aria-label="设置分类"
          >
            <button
              type="button"
              class="menu-tab"
              role="tab"
              id="settings-tab-appearance"
              aria-selected="true"
              aria-controls="settings-pane-appearance"
              tabindex="0"
            >
              外观
            </button>
            <button
              type="button"
              class="menu-tab"
              role="tab"
              id="settings-tab-text"
              aria-selected="false"
              aria-controls="settings-pane-text"
              tabindex="-1"
            >
              文字
            </button>
            <button
              type="button"
              class="menu-tab"
              role="tab"
              id="settings-tab-behavior"
              aria-selected="false"
              aria-controls="settings-pane-behavior"
              tabindex="-1"
            >
              操作
            </button>
          </div>
          <div class="menu-panel-content" id="settings-content">
            <div
              id="settings-pane-appearance"
              class="menu-tab-panel"
              role="tabpanel"
              aria-labelledby="settings-tab-appearance"
            >
              <div class="menu-section">
                <div class="menu-section-label">主题</div>
                <div class="menu-toggle-group" id="theme-group">
                  <button
                    class="menu-toggle-btn"
                    type="button"
                    id="theme-light"
                    data-value="light"
                  >
                    浅色
                  </button>
                  <button
                    class="menu-toggle-btn"
                    type="button"
                    id="theme-dark"
                    data-value="dark"
                  >
                    深色
                  </button>
                </div>
              </div>
              <div class="menu-section">
                <div class="menu-section-label">图标</div>
                <div class="menu-toggle-group" id="icon-style-group">
                  <button
                    class="menu-toggle-btn"
                    type="button"
                    id="icon-style-clay"
                    data-value="clay"
                  >
                    品牌软陶
                  </button>
                  <button
                    class="menu-toggle-btn"
                    type="button"
                    id="icon-style-flat"
                    data-value="flat"
                  >
                    彩色扁平
                  </button>
                </div>
              </div>
              <div class="menu-section">
                <label class="menu-range-control">
                  <span>
                    卡片尺寸
                    <strong id="card-size-value">88px</strong>
                  </span>
                  <input
                    type="range"
                    id="card-size"
                    min="80"
                    max="200"
                    step="1"
                    value="88"
                  />
                </label>
                <label class="menu-range-control">
                  <span>
                    圆角
                    <strong id="card-radius-value">32%</strong>
                  </span>
                  <input
                    type="range"
                    id="card-radius"
                    min="0"
                    max="50"
                    step="1"
                    value="32"
                  />
                </label>
                <label class="menu-range-control">
                  <span>
                    间距
                    <strong id="card-gap-value">28px</strong>
                  </span>
                  <input
                    type="range"
                    id="card-gap"
                    min="8"
                    max="64"
                    step="4"
                    value="28"
                  />
                </label>
              </div>
              <details class="menu-section more-appearance">
                <summary>
                  更多外观
                  <span data-icon="chevron-right"></span>
                </summary>
                <label class="menu-range-control">
                  <span>
                    顶部栏背景
                    <strong id="header-opacity-value">94%</strong>
                  </span>
                  <input
                    type="range"
                    id="header-opacity"
                    min="55"
                    max="100"
                    step="1"
                    value="94"
                  />
                </label>
              </details>
            </div>
            <div
              id="settings-pane-text"
              class="menu-tab-panel"
              role="tabpanel"
              aria-labelledby="settings-tab-text"
              hidden
            >
              <div class="menu-section">
                <label class="menu-select-control">
                  <span>字体</span>
                  <select id="card-font-family">
                    <option value="system">系统清晰</option>
                    <option value="pingfang">苹方</option>
                    <option value="yahei">微软雅黑</option>
                    <option value="noto">思源黑体</option>
                    <option value="serif">思源宋体</option>
                  </select>
                </label>
                <label class="menu-range-control">
                  <span>
                    标题字号
                    <strong id="card-title-size-value">14px</strong>
                  </span>
                  <input
                    type="range"
                    id="card-title-size"
                    min="14"
                    max="20"
                    step="1"
                    value="14"
                  />
                </label>
                <label class="menu-range-control">
                  <span>
                    标题字距
                    <strong id="card-title-tracking-value">0em</strong>
                  </span>
                  <input
                    type="range"
                    id="card-title-tracking"
                    min="-2"
                    max="8"
                    step="1"
                    value="0"
                  />
                </label>
              </div>
            </div>
            <div
              id="settings-pane-behavior"
              class="menu-tab-panel"
              role="tabpanel"
              aria-labelledby="settings-tab-behavior"
              hidden
            >
              <div class="menu-section">
                <div class="menu-section-label">打开书签</div>
                <div class="menu-toggle-group" id="open-mode-group">
                  <button
                    class="menu-toggle-btn"
                    type="button"
                    id="open-mode-current"
                    data-value="current"
                  >
                    当前页
                  </button>
                  <button
                    class="menu-toggle-btn"
                    type="button"
                    id="open-mode-new"
                    data-value="new"
                  >
                    后台新标签页
                  </button>
                </div>
              </div>
              <a class="help-link" href="help.html#shortcuts">
                <span data-icon="circle-question-mark"></span>
                查看快捷键
                <span data-icon="chevron-right"></span>
              </a>
            </div>
          </div>
        </div>
      </div>
      <div
        id="edit-dialog"
        class="dialog hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="edit-dialog-title"
      >
        <div class="dialog-overlay"></div>
        <div class="dialog-content">
          <div class="dialog-header">
            <h3 id="edit-dialog-title">新建书签</h3>
            <button
              class="dialog-close"
              type="button"
              data-action="close"
              aria-label="关闭"
            >
              <span data-icon="x"></span>
            </button>
          </div>
          <div class="dialog-body">
            <div class="form-group">
              <label for="edit-title">名称</label>
              <input
                type="text"
                id="edit-title"
                class="form-input"
                autocomplete="off"
              />
            </div>
            <div class="form-group">
              <label for="edit-url">网址</label>
              <input
                type="url"
                id="edit-url"
                class="form-input"
                placeholder="https://example.com"
                autocomplete="off"
              />
            </div>
          </div>
          <div class="dialog-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-action="cancel"
            >
              取消
            </button>
            <button
              type="button"
              class="btn btn-primary"
              id="edit-dialog-confirm"
            >
              创建
            </button>
          </div>
        </div>
      </div>
      <div
        id="move-dialog"
        class="dialog hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="move-dialog-title"
      >
        <div class="dialog-overlay"></div>
        <div class="dialog-content">
          <div class="dialog-header">
            <h3 id="move-dialog-title">移动与排序</h3>
            <button
              class="dialog-close"
              type="button"
              data-action="close"
              aria-label="关闭"
            >
              <span data-icon="x"></span>
            </button>
          </div>
          <div class="dialog-body">
            <div id="move-dialog-tree" class="folder-tree"></div>
            <label class="form-group">
              <span>放置位置</span>
              <select id="move-position" class="form-input">
                <option value="last">放在最后</option>
                <option value="first">放在最前</option>
              </select>
            </label>
          </div>
          <div class="dialog-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-action="cancel"
            >
              取消
            </button>
            <button
              type="button"
              class="btn btn-primary"
              id="move-dialog-confirm"
            >
              移动
            </button>
          </div>
        </div>
      </div>
      <div
        id="delete-confirm-dialog"
        class="dialog hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="delete-confirm-dialog-title"
      >
        <div class="dialog-overlay"></div>
        <div class="dialog-content">
          <div class="dialog-header">
            <h3 id="delete-confirm-dialog-title">确认删除</h3>
            <button
              class="dialog-close"
              type="button"
              data-action="close"
              aria-label="关闭"
            >
              <span data-icon="x"></span>
            </button>
          </div>
          <div class="dialog-body"><p id="delete-confirm-message"></p></div>
          <div class="dialog-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-action="cancel"
            >
              取消
            </button>
            <button
              type="button"
              class="btn btn-danger"
              id="delete-confirm-btn"
            >
              删除
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="vendor/gsap.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
