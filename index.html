<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkPad</title>
  <!-- 标签页使用高对比的 16px 专用图标，避免完整应用图标缩小后细节丢失。 -->
  <link rel="icon" type="image/svg+xml" sizes="any" href="icons/tab-icon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/icon48.png">
  <!-- 在首次绘制前定好 data-theme，避免深色模式闪一下亮色；细节见 theme-init.js -->
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app" class="page-enter-pending">
    <!-- 顶部工具栏 -->
    <header id="toolbar" class="toolbar">
      <nav id="breadcrumb" class="breadcrumb">
        <span class="breadcrumb-item" data-id="1">书签栏</span>
      </nav>

      <div class="toolbar-section toolbar-utility-actions">
        <button id="menu-trigger" class="toolbar-btn toolbar-icon-btn menu-trigger" type="button" aria-label="设置" aria-controls="menu-panel" aria-haspopup="dialog" aria-expanded="false" title="设置">
          <span class="toolbar-icon" data-icon="settings"></span>
        </button>
      </div>
    </header>

    <!-- 书签内容区（卡片网格） -->
    <main id="content" class="content">
      <!-- 网格滚动区 -->
      <div class="grid-scroll">
        <div class="grid-scroll-inner">
          <div id="bookmark-grid" class="bookmark-grid"></div>
        </div>
      </div>
    </main>

    <!-- 拖拽：左侧移动面板 -->
    <div id="drag-move-panel" class="drag-side-panel drag-move-panel">
      <div class="drag-panel-header">移动到…</div>
      <div id="drag-folder-tree" class="drag-folder-tree"></div>
    </div>

    <!-- 拖拽：右侧删除区域 -->
    <div id="drag-delete-zone" class="drag-delete-zone">
      <div class="drag-panel-header">删除书签</div>
      <div class="drag-delete-content">
        <div class="drag-delete-icon" data-icon="trash"></div>
        <div class="drag-delete-label">松手后确认删除</div>
      </div>
    </div>

    <!-- 头部工具面板 -->
    <div id="menu-panel" class="menu-panel" role="dialog" aria-labelledby="settings-title" inert aria-hidden="true">
      <div class="menu-panel-header">
        <div id="settings-title" class="menu-panel-title">设置</div>
        <button id="settings-close" class="menu-panel-close" type="button" aria-label="关闭设置"><span data-icon="x"></span></button>
      </div>
      <div id="settings-tabs" class="menu-tabs" role="tablist" aria-label="设置分类">
        <button id="settings-tab-appearance" class="menu-tab" type="button" role="tab" aria-controls="settings-pane-appearance" aria-selected="true" tabindex="0">外观</button>
        <button id="settings-tab-text" class="menu-tab" type="button" role="tab" aria-controls="settings-pane-text" aria-selected="false" tabindex="-1">文字</button>
        <button id="settings-tab-behavior" class="menu-tab" type="button" role="tab" aria-controls="settings-pane-behavior" aria-selected="false" tabindex="-1">操作</button>
      </div>
      <div id="settings-content" class="menu-panel-content">
        <div id="settings-pane-appearance" class="menu-tab-panel" role="tabpanel" aria-labelledby="settings-tab-appearance">
          <div class="menu-section menu-section-major">
            <div class="menu-section-heading">
              <div class="menu-section-label">主题</div>
              <p>浅色和深色两种配色，深色统一使用中性深灰。</p>
            </div>
            <div class="menu-toggle-group" id="theme-group">
              <button class="menu-toggle-btn" type="button" data-value="light" id="theme-light">浅色</button>
              <button class="menu-toggle-btn" type="button" data-value="dark" id="theme-dark">深色</button>
            </div>
          </div>
          <div class="menu-section menu-section-major">
            <div class="menu-section-heading">
              <div class="menu-section-label">书签卡片</div>
              <p>控制卡片尺寸、圆角与网格留白；文字排版在「文字」页签调整。</p>
            </div>
            <div class="menu-range-stack">
                <label class="menu-range-control">
                  <span>卡片尺寸 <strong id="card-size-value">120px</strong></span>
                  <input type="range" id="card-size" min="80" max="200" step="20" value="120">
                  <span class="menu-range-scale"><small>紧凑</small><small>宽松</small></span>
                </label>
                <label class="menu-range-control">
                  <span>卡片圆角 <strong id="card-radius-value">18px</strong></span>
                  <input type="range" id="card-radius" min="0" max="87" step="1" value="18">
                  <span class="menu-range-scale"><small>直角</small><small>圆润</small></span>
                </label>
                <label class="menu-range-control">
                  <span>卡片容器边距 <strong id="grid-page-margin-value">24px</strong></span>
                  <input type="range" id="grid-page-margin" min="12" max="160" step="4" value="24">
                  <span class="menu-range-scale"><small>紧凑</small><small>留白</small></span>
                </label>
                <label class="menu-range-control">
                  <span>卡片间距 <strong id="card-gap-value">28px</strong></span>
                  <input type="range" id="card-gap" min="8" max="64" step="4" value="28">
                  <span class="menu-range-scale"><small>紧凑</small><small>舒展</small></span>
                </label>
            </div>
          </div>
          <div class="menu-section menu-section-major">
            <div class="menu-section-heading">
              <div class="menu-section-label">顶部栏</div>
              <p>调整导航和工具按钮背后的衬底强度。</p>
            </div>
            <div class="menu-range-stack">
              <label class="menu-range-control">
                <span>顶部栏背景强度 <strong id="header-opacity-value">94%</strong></span>
                <input type="range" id="header-opacity" min="55" max="100" step="1" value="94">
                <span class="menu-range-scale"><small>更通透</small><small>更清晰</small></span>
              </label>
            </div>
          </div>
        </div>
        <div id="settings-pane-text" class="menu-tab-panel" role="tabpanel" aria-labelledby="settings-tab-text" hidden>
          <div class="menu-section menu-section-major">
            <div class="menu-section-heading">
              <div class="menu-section-label">文字</div>
              <p>字体应用于整个页面；字号调整卡片文字，字距只调整标题。</p>
            </div>
            <div class="menu-range-stack">
              <label class="menu-select-control">
                <span>字体</span>
                <select id="card-font-family">
                  <option value="system">系统清晰</option>
                  <option value="pingfang">苹方</option>
                  <option value="yahei">微软雅黑</option>
                  <option value="noto">思源黑体</option>
                  <option value="serif">思源宋体</option>
                </select>
              </label>
              <label class="menu-range-control">
                <span>标题字号 <strong id="card-title-size-value">16px</strong></span>
                <input type="range" id="card-title-size" min="14" max="20" step="1" value="16">
                <span class="menu-range-scale"><small>紧凑</small><small>醒目</small></span>
              </label>
              <label class="menu-range-control">
                <span>标题字距 <strong id="card-title-tracking-value">0.01em</strong></span>
                <input type="range" id="card-title-tracking" min="-2" max="8" step="1" value="1">
                <span class="menu-range-scale"><small>紧凑</small><small>舒展</small></span>
              </label>
            </div>
          </div>
        </div>
        <div id="settings-pane-behavior" class="menu-tab-panel" role="tabpanel" aria-labelledby="settings-tab-behavior" hidden>
          <div class="menu-section">
            <div class="menu-section-label">打开行为</div>
            <div class="menu-toggle-group" id="open-mode-group">
              <button class="menu-toggle-btn" type="button" data-value="new" id="open-mode-new">新标签页</button>
              <button class="menu-toggle-btn" type="button" data-value="current" id="open-mode-current">当前页</button>
            </div>
          </div>
          <div class="menu-section">
            <div class="menu-section-label">快捷键</div>
            <div class="shortcuts-list">
              <div class="shortcut-item"><kbd>N</kbd> 新建书签</div>
              <div class="shortcut-item"><kbd>Shift+N</kbd> 新建文件夹</div>
              <div class="shortcut-item"><kbd>Enter</kbd> 打开选中项</div>
              <div class="shortcut-item"><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> 导航</div>
              <div class="shortcut-item"><kbd>Backspace</kbd> 返回上级</div>
              <div class="shortcut-item"><kbd>Delete</kbd> 删除选中项</div>
              <div class="shortcut-item"><kbd>F2</kbd> 编辑选中项</div>
              <div class="shortcut-item"><kbd>Ctrl+Click</kbd> 多选</div>
              <div class="shortcut-item"><kbd>=</kbd> / <kbd>-</kbd> 放大 / 缩小卡片</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 编辑书签弹窗 -->
    <div id="edit-dialog" class="dialog hidden">
      <div class="dialog-overlay"></div>
      <div class="dialog-content">
        <div class="dialog-header">
          <h3 id="edit-dialog-title">新建书签</h3>
          <button class="dialog-close" data-action="close" aria-label="关闭">
            <span data-icon="x"></span>
          </button>
        </div>
        <div class="dialog-body">
          <div class="form-group">
            <label for="edit-title">标题</label>
            <input type="text" id="edit-title" class="form-input" placeholder="输入书签标题" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="edit-url">网址</label>
            <input type="url" id="edit-url" class="form-input" placeholder="https://example.com" autocomplete="off">
          </div>
        </div>
        <div class="dialog-footer">
          <button class="btn btn-secondary" data-action="cancel">取消</button>
          <button class="btn btn-primary" id="edit-dialog-confirm">确认</button>
        </div>
      </div>
    </div>

    <!-- 移动书签弹窗 -->
    <div id="move-dialog" class="dialog hidden">
      <div class="dialog-overlay"></div>
      <div class="dialog-content">
        <div class="dialog-header">
          <h3>移动到…</h3>
          <button class="dialog-close" data-action="close" aria-label="关闭">
            <span data-icon="x"></span>
          </button>
        </div>
        <div class="dialog-body">
          <div id="move-dialog-tree" class="folder-tree"></div>
        </div>
        <div class="dialog-footer">
          <button class="btn btn-secondary" data-action="cancel">取消</button>
          <button class="btn btn-primary" id="move-dialog-confirm">确认</button>
        </div>
      </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div id="delete-confirm-dialog" class="dialog hidden">
      <div class="dialog-overlay"></div>
      <div class="dialog-content">
        <div class="dialog-header">
          <h3>确认删除</h3>
          <button class="dialog-close" data-action="close" aria-label="关闭">
            <span data-icon="x"></span>
          </button>
        </div>
        <div class="dialog-body">
          <p id="delete-confirm-message">确定要删除吗？</p>
        </div>
        <div class="dialog-footer">
          <button class="btn btn-secondary" data-action="cancel">取消</button>
          <button class="btn btn-danger" id="delete-confirm-btn">删除</button>
        </div>
      </div>
    </div>

  </div>

  <!-- gsap 的 UMD 发行版必须在严格模式的模块之前用经典脚本加载，详见 vendor/gsap.js -->
  <script src="vendor/gsap.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
